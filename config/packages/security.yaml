security:
    # Hachage des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Recherche de l'utilisateur avec son e-mail
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Désactive la sécurité pour les outils de développement
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall principal de l'application
        main:
            lazy: true

            # Provider utilisé pour récupérer les utilisateurs
            provider: app_user_provider

            # Connexion avec le formulaire
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password

            # Déconnexion
            logout:
                path: app_logout
                target: app_login

    # Gestion des accès
    access_control:
        # Exemple :
        # - { path: ^/account, roles: ROLE_USER }
        # - { path: ^/admin, roles: ROLE_ADMIN }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10